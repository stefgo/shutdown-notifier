services:
  shutdown-notifier:
    container_name: shutdown-notifier
    build:
      context: .
      # The build installs @stefgo/js-template-engine from GitHub Packages, which wants a
      # token even for a public package: NPM_TOKEN, a token with read:packages.
      secrets:
        - npm_token
    image: shutdown-notifier
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - SHUTDOWN_HTTP_URL=${SHUTDOWN_HTTP_URL:-}
      - SHUTDOWN_HTTP_HEADERS=${SHUTDOWN_HTTP_HEADERS:-}
      - SHUTDOWN_HTTP_TIMEOUT=${SHUTDOWN_HTTP_TIMEOUT:-10}
      - SHUTDOWN_MQTT_URL=${SHUTDOWN_MQTT_URL:-}
      - SHUTDOWN_MQTT_TOPIC=${SHUTDOWN_MQTT_TOPIC:-}
      - SHUTDOWN_MQTT_USERNAME=${SHUTDOWN_MQTT_USERNAME:-}
      - SHUTDOWN_MQTT_PASSWORD=${SHUTDOWN_MQTT_PASSWORD:-}
      - SHUTDOWN_MQTT_CLIENT_ID=${SHUTDOWN_MQTT_CLIENT_ID:-}
      - SHUTDOWN_MQTT_QOS=${SHUTDOWN_MQTT_QOS:-1}
      - SHUTDOWN_MQTT_RETAIN=${SHUTDOWN_MQTT_RETAIN:-false}
      - SHUTDOWN_MQTT_TIMEOUT=${SHUTDOWN_MQTT_TIMEOUT:-10}
      - SHUTDOWN_MQTT_TEMPLATE_FILE=${SHUTDOWN_MQTT_TEMPLATE_FILE:-}
      - SHUTDOWN_NOTIFY_DELAY=${SHUTDOWN_NOTIFY_DELAY:-3}
      - SHUTDOWN_REMEMBER_TIME=${SHUTDOWN_REMEMBER_TIME:-300}
      - SHUTDOWN_POLL_INTERVAL=${SHUTDOWN_POLL_INTERVAL:-60}
      - SHUTDOWN_MONITOR_PATH=${SHUTDOWN_MONITOR_PATH:-/run/systemd/shutdown}
      - SHUTDOWN_MONITOR_FILE=${SHUTDOWN_MONITOR_FILE:-scheduled}
      - SHUTDOWN_HTTP_TEMPLATE_FILE=${SHUTDOWN_HTTP_TEMPLATE_FILE:-/config/template.json}
      # Inside a container the hostname is the container's; name the host here.
      - SHUTDOWN_HOSTNAME=${SHUTDOWN_HOSTNAME:-}
      - SHUTDOWN_LOG_LEVEL=${SHUTDOWN_LOG_LEVEL:-info}
    volumes:
      - /run/systemd/shutdown:/run/systemd/shutdown:ro
      # A template of your own, in place of the one the image ships:
      # - ./config/template.json:/config/template.json:ro

networks:
  none:
    external: true

secrets:
  npm_token:
    environment: NPM_TOKEN
